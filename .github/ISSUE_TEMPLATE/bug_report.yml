name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This framework treats documented behavior as a contract —
        a confirmed mismatch between docs and behavior is a red build, so precise reports
        are genuinely valuable.
  - type: input
    id: version
    attributes:
      label: xubb-agents version
      description: "`python -c \"import xubb_agents; print(xubb_agents.__version__)\"`"
      placeholder: "2.6.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.4"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest snippet (agent config + call) that shows the problem. If it involves
        an LLM response shape, a faked client is ideal — the whole test suite runs offline.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What the docs/spec say should happen (a link to the section helps).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead — include log output or the exception if there is one.
    validations:
      required: true
