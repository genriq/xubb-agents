# Xubb Agents — contract gate (see docs/PROCESS.md).
# Blocks merge on (a) a red suite and (b) any broken `covered` contract or
# malformed CONTRACTS.yaml. This is what makes the Contract Registry a HARD gate
# rather than an advisory document — the line the F-1 escape could not cross.
name: contract-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the suite exactly once and emit a JUnit report; the gate consumes it
      # (no double execution).
      - name: Test suite (red-suite gate)
        run: pytest tests -q --junitxml=junit.xml

      - name: Contract gate (G1/G2/G3)
        run: python tools/check_contracts.py --junit junit.xml

  # Distribution evidence (H2 / audit): the INSTALLED wheel, in a fresh venv, run
  # from outside the source checkout. This is what a host actually receives.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel . -w dist --no-deps

      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl

      - name: Smoke the installed package from outside the checkout
        run: |
          cp tools/wheel_smoke.py "$RUNNER_TEMP/wheel_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" wheel_smoke.py
