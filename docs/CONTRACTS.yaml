  - id: STRUCTURED-OUTPUT-FALLBACK
    statement: >
      structured_outputs is an independent transport control (strict | auto |
      json_object; default auto) on the LLM client, preserved across key rotation.
      A strict request carries response_format.type == "json_schema", strict: true and
      the effective enum (INV-24); json_object never sends a schema. "strict" never
      downgrades. "auto" downgrades ONCE per capability key (endpoint, model, adapter,
      adapter version, schema version) and only when the adapter classifies a 400 on a
      json_schema request as unsupported_capability AND it exactly matches an enabled,
      evidence-backed signature; the downgrade is recorded on the client and reported on
      the response. Schema-invalid, auth, rate-limit, unknown-model, wrong-parameter,
      lint-failed and refusal outcomes never downgrade; with the shipped (empty) registry
      auto fails closed. Under typed_v1, strict mode requires a schema adapter declaring
      json_schema transport at registration.
