  - id: ITC-22.FW-input-batch-idempotency
    statement: >
      Within one input batch an answer event_id is accepted once: a repeat with identical
      content is rejected as duplicate_event_id and a repeat with different content as
      conflicting_event_id (invalid_input_reference), while valid events still pass. The
      host owns durable idempotency across batches; the engine does not claim cross-process
      exactly-once delivery.
