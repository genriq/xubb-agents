  # ---- XUBB-ITC-1 — G3 part 1: reply drafts and correlated questions (§9, §11) ----

  - id: ITC-17.FW-reply-is-a-permissioned-draft
    statement: >
      A REPLY is emitted only with allow_reply, its membership in allowed_types, host
      reply_drafts, an explicit principal and the typed contract; otherwise it is
      type_not_allowed (static) or capability_unavailable (missing principal). It is a
      draft: the engine emits the insight and invokes nothing — no event, queue, sidecar
      or state write results from it, and the generated instruction states the draft
      rule. Legacy mode cannot produce a reply.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §7.2, §9"
      - "src/xubb_agents/core/insight_validation.py: effective_insight_types"
    invariant: ITC-17.FW
    test: "tests/test_reply_question_g3.py::TestReplyDrafts::test_reply_accepted_with_all_prerequisites_as_a_draft"
    test_no_flag: "tests/test_reply_question_g3.py::TestReplyDrafts::test_reply_without_agent_permission_is_not_allowed"
    test_no_host: "tests/test_reply_question_g3.py::TestReplyDrafts::test_reply_without_host_draft_support_is_not_allowed"
    test_no_principal: "tests/test_reply_question_g3.py::TestReplyDrafts::test_reply_without_principal_is_capability_unavailable"
    test_legacy: "tests/test_reply_question_g3.py::TestReplyDrafts::test_reply_requires_typed_contract"
    test_prompt: "tests/test_reply_question_g3.py::TestReplyDrafts::test_prompt_states_the_draft_rule"
    status: covered   # G3 part 1. Host-side draft distinction (ITC-17.HOST) is a conformance run, not claimed.

  - id: ITC-21.FW-question-requires-input-path-and-correlates
    statement: >
      A QUESTION is emitted only with allow_question, its membership in allowed_types,
      host text_questions, an explicit principal, the typed contract and a
      question.reason; its engine-assigned id is the answer correlation key. Host answer
      events are validated at turn start against the retained question records (same
      session, active, same principal, answered ⇒ text, dismissed ⇒ no text); invalid
      events are dropped with an engine diagnostic and never shown. Validated answers
      reach only the originating agent (prompt section and {{ insight_answers }}) unless
      the host sets answers_shared; a dismissal is presented as not an answer and not
      consent; answers are data and change no permission or identity; receiving an answer
      schedules nothing; the host's list is never mutated and the validated subset
      reaches both phases.
    source:
