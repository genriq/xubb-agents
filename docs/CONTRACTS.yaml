  - id: TYPED-ADAPTER-FLAT-V1
    statement: >
      The `default` schema registers under typed_v1 through the flat_v1 adapter: the
      generated instruction offers the candidate at the root plus the schema's memory
      channel and nothing else; the flat normalization applies (placeholders under a
      false gate discarded); the legacy instruction and parse path are unchanged.
    source:
      - "src/xubb_agents/library/schemas/default.json: descriptor"
      - "src/xubb_agents/library/dynamic.py: _typed_instruction / _normalize_typed (flat_v1)"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.1"
    invariant: INV-49
    test: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_accepted_flat_result_is_a_typed_insight_and_memory_commits"
    test_instruction: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_default_registers_and_instruction_is_candidate_plus_memory"
    test_silence: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_false_gate_with_placeholders_is_silence_and_memory_still_commits"
    test_state_only: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_state_only_default_agent_gets_the_silence_envelope_with_memory"
    test_legacy_unchanged: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_legacy_path_for_default_is_unchanged"
    test_control: "tests/test_typed_reach_2_8.py::TestFlatV1Adapter::test_control_typed_declaration_without_an_adapter_is_refused"
    status: covered   # v2.8 TA-1

  - id: TYPED-ADAPTER-ROOT-V2-SIDECAR
    statement: >
      ui_control and widget_control register under typed_v1 through root_v2: the
      generated instruction names the state block by the mapping's variable_updates_field
      and the sidecar block by its data_field with the descriptor's sidecar_instruction;
      an accepted result stages insight, state and sidecar; silence may still act; v2_raw
      renders no sidecar. The block is generated from the descriptor, never assumed.
    source:
      - "src/xubb_agents/library/schemas/ui_control.json: descriptor"
      - "src/xubb_agents/library/schemas/widget_control.json: descriptor"
      - "src/xubb_agents/library/dynamic.py: _typed_instruction (root_v2)"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.2"
