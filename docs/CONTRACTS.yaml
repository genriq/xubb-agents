  # ---- XUBB-ITC-1 — G1 part 2: typed acceptance (typed_v1) ----

  - id: ITC-03.FW-prompt-schema-vocabulary-agree
    statement: >
      Under typed_v1 the instruction sent to the model is GENERATED per run and lists
      exactly the effective type set (framework ∩ agent ∩ schema ∩ host ∩ prerequisites
