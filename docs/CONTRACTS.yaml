    test_no_static_enum: "tests/test_typed_acceptance_g1.py::TestGeneratedInstruction::test_static_legacy_enum_is_not_sent_in_typed_mode"
    test_descriptors: "tests/test_insight_vocabulary_g1.py::TestDescriptorInstructionAgreement::test_shipped_descriptors_declare_their_contracts_honestly"
    status: covered   # G1 part 2.

  - id: ITC-07.FW-capability-intersection-enforced
    statement: >
      Typed acceptance enforces the §7.2 intersection for DynamicAgent and custom
      BaseAgent output alike: a type outside the agent's allowed_types, the schema's or
      the host's declared set is type_not_allowed; a run-specific loss (missing
      principal) is reported as capability_unavailable while permitted types still
      land; interactive types stay unavailable until their lifecycle is implemented.
      FORCE, priority, confidence and urgency never bypass these checks.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §7.2, §15.2"
      - "src/xubb_agents/core/insight_validation.py: effective_insight_types"
      - "src/xubb_agents/core/engine.py: _enforce_typed"
    invariant: ITC-07.FW
