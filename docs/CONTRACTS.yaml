  # ---- XUBB-ITC-1 — G2 part 2: provider structured outputs (SO-1, §13.3) ----

  - id: PROVIDER-SCHEMA-DERIVATION
    statement: >
      The provider projection is compiled at runtime from the shipped authoritative
      contract (library/contract/normalized_insight.schema.json + the domain-envelope
      descriptor), never from a hand-maintained list: it equals the packaged projections,
      passes the conservative-subset lint (closed objects, every property required, no
      local-only keywords), carries the run's exact effective type enum with no
      engine-owned or un-negotiated content-extension keys, and an empty effective set
      compiles to a silence-only envelope — never an empty enum. The shipped fallback
      registry enables no production signature.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §7.3, §13.3"
