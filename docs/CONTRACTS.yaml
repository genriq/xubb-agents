  - id: INV-4-sys-keys-governed
    statement: >
      Reserved sys.* keys are engine-governed; unauthorized writes are detected/flagged.
      A direct host write via Blackboard.set_var warns and applies (unchanged). An
      AGENT-proposed sys.* write (variable_updates / non-memory state_updates) is a
      reserved_state_write: the whole response is rejected at the engine boundary and
      nothing from it commits (XUBB-ITC-1 §8.6, D-LR fatal row; G0).
    source:
      - "docs/archive/SPEC_V2_1_HARDENING.md: INV-4"
      - "docs/SPEC_INSIGHT_TYPES.md: §8.6 (D-LR fatal rows)"
      - "src/xubb_agents/core/engine.py: _enforce_acceptance"
    invariant: INV-4
    test: "tests/test_blackboard.py::TestBlackboardVariables::test_unauthorized_sys_write_is_flagged"
    test_engine_sets: "tests/test_engine.py::TestProcessTurn::test_sys_variables_set"
    test_agent_write_rejected: "tests/test_legacy_acceptance_g0.py::TestFatalRejection::test_reserved_sys_write_rejects_whole_response"
    test_custom_agent_boundary: "tests/test_legacy_acceptance_g0.py::TestFatalRejection::test_custom_agent_reserved_write_rejected_at_boundary"
    status: covered   # host write flagged (warning); agent-proposed write rejects the response (G0).

