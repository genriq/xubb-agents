  - id: CONTENT-TASK-LIFECYCLE
    statement: >
      Content-task capacity (content_limits.max_concurrent_content_tasks) is reserved
      synchronously at the entrypoint before the snapshot copy, the clone and the task
      exist, and released by the task's done-callback on EVERY exit — completion,
      rejection, exception, cancellation while running, and cancellation before the
      coroutine first ran. Completed handles leave the pending registry while their
      results stay readable through the handle; session closure revokes and cancels
      pending tasks only. The bound limits content-task concurrency; it does not reserve
      live-provider capacity.
