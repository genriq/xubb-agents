    status: covered   # C1.

  - id: ITC-27.FW-preview-never-replaces-body
    statement: >
      The complete accepted body is emitted in content; preview is a separate optional
      plain-text field under the same insight id; they are one insight, and serialization
      carries both unchanged. The legacy projection omits every extension field.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §14.5, §14.10"
    invariant: ITC-27.FW
    test: "tests/test_long_form_c1.py::TestBodyPreviewAndLimits::test_preview_never_replaces_the_body_and_shares_its_identity"
    test_projection: "tests/test_long_form_c1.py::TestNegotiation::test_negotiated_output_carries_extension_fields_non_negotiated_does_not"
    status: covered   # C1. Host storage/expansion/export fidelity (ITC-27.HOST) is a conformance run.

  - id: ITC-28.FW-depth-resolution-and-admission
    statement: >
      Effective depth is the host's request for the agent, else the agent's default; an
      unavailable profile is unsupported_depth. Admission runs BEFORE generation against
      the host's trusted execution declaration: in an active session only brief within the
      operator's live ceilings is admitted (a brief profile cannot evade them with larger
      budgets); standard/detailed need a declared pause or post-session execution; the
      isolated active path is refused (isolated_path_not_implemented) until C2; a missing
      declaration is invalid_content_execution_context; a rejected plan makes no call.
      FORCE is neither authorization nor isolation. The admitted profile's output-token cap
      and per-request timeout are the generation budget.
