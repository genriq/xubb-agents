  # ---- XUBB-ITC-1 — C2: isolated active-session extended generation (§14.6.1, §14.9; DL-6) ----

  - id: CONTENT-ISOLATED-PATH
    statement: >
      AgentEngine.start_content_request runs extended generation OUTSIDE the live turn
      path: on a FRESH agent instance (DynamicAgent only; custom instances are refused as
      shared mutable state), over a frozen deep copy of the context, under an
      ENGINE-issued isolated declaration — a host-authored isolated declaration is
      refused. The task never holds the live turn path, never writes the live Blackboard
      or private memory, never bumps the live turn counter and never reserves correction
      targets; live turns proceed concurrently. Its output is result-only: proposed
      domain effects or interactive types reject it. Admission is bounded
      (content_limits.max_concurrent_content_tasks, default 1; exhaustion rejects without
      queueing; the bound limits content-task concurrency only and reserves no
      live-provider capacity). Cancelling the handle or closing the session revokes publication — a late
      result reports cancelled with usage and diagnostics retained. Results carry the
      request and source-snapshot ids for the host's currentness check and are stamped
      with the snapshot turn.
    source:
