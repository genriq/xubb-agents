  - id: ITC-02.FW-information-alias
    statement: >
      InsightType.INFORMATION is InsightType.FACT: same member, .value == "fact",
      .name == "FACT"; iteration yields ten unique members, __members__ eleven names;
      the enum is not @unique; display labels come from INSIGHT_TYPE_LABELS, never
      .name; the wire value "information" is not accepted (a future versioned migration).
    source:
