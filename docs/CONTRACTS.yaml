    status: covered   # H2. Closes audit XA-05.

  - id: PROMPT-FIELDS-FROM-CONTRACT
    statement: >
      The generated typed instruction derives its forbidden-field rule from the same
      effective descriptor as its requested fields — with long_form_v1 negotiated,
      preview and content_format are requested and never forbidden; otherwise they are
      forbidden — and exposes the citation contract, the transcript/document citation
      markers and the host's citable ids whenever an ENABLED type needs an evidence
      basis (consulting profile, or a permitted correction in any profile), so the
