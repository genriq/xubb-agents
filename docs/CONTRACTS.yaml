    test_unit: "tests/test_insight_validation.py::TestDecideLegacy::test_accepted_silent"
    status: covered   # G0.

  - id: ITC-06.FW-unknown-type-rejects-no-relabel
    statement: >
      An unrecognised type label (unknown_type) or a recognised-but-disallowed wire value
      on the legacy path — error, observation, reply, correction, question (type_not_allowed)
      — rejects every insight from that result and NEVER relabels it as suggestion,
      information, observation or any other purpose. Independently valid channels commit
      (partial); with none, the response is rejected. The diagnostic carries a bounded
      classification, never the content. Case-folding and the absent-type default
      ("suggestion") are declared legacy adapter normalisations, not relabels.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.6 (D-LR)"
      - "docs/INSIGHT_TYPES_FINAL_DECISIONS.md: D-LR"
      - "src/xubb_agents/core/insight_validation.py: normalize_legacy_type"
