  - id: TYPED-FAILURES-ARE-DIAGNOSTICS
    statement: >
      Under typed_v1 an evaluation failure produces diagnostics only (invalid_envelope,
      classification agent_error:<ExceptionType>, no exception text) and no insight: the
      framework-manufactured ERROR card is converted at the boundary and never forwarded
      by the merge; every typed insight in a final response has a human-facing type and
      engine-minted identity. The sanitized ERROR card remains a legacy_v2-only surface.
    source:
