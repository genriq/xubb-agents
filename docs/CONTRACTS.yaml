    test_occurrences: "tests/test_evidence_catalog_g2.py::TestReferencesResolveOnlyToExposedEvidence::test_identical_occurrences_are_distinct_references"
    test_not_durable: "tests/test_evidence_catalog_g2.py::TestReferencesResolveOnlyToExposedEvidence::test_snapshot_ids_differ_per_invocation"
    test_unit_resolution: "tests/test_evidence_catalog_g2.py::TestReferenceContextResolution::test_unknown_and_cross_session"
    status: covered   # G2 part 1.

  - id: ITC-16.FW-general-evidence-optional-subtype-support-mandatory
    statement: >
      A general OBSERVATION needs no evidence reference. A consulting hypothesis
      requires at least one resolvable evidence reference, a rationale and a
      validation step; an implication requires evidence and a rationale; subtypes are
      rejected outside the consulting profile and on non-observation types. Citation
      markers and the citation contract are shown to the model only for the consulting
      profile.
