  # ---- XUBB-ITC-1 (docs/SPEC_INSIGHT_TYPES.md 1.2.0) — G0 legacy safety, FRAMEWORK leaves only ----
  # Parent ITC-nn ids are requirements, never evidence. Each entry below is one
  # framework-scope leaf from docs/insight_contract_v1_2/CONTRACT_OWNERSHIP.json,
  # implemented on the legacy_v2 path. Host (.HOST) and end-to-end (.E2E) leaves are
  # NOT registered here — they need a version-identified host run / installed-wheel
  # integration (see HOST_CONFORMANCE_KIT.md). Typed-mode (typed_v1) leaves land at G1.

  - id: ITC-04.FW-strict-boolean-gate
    statement: >
      Only an actual Boolean true authorizes an insight candidate. false is valid silence.
      Strings ("true"/"false"), numbers, null and a missing required gate are invalid_gate:
      the result never speaks and the malformed gate is reported. Presence-gated adapters
      (root_key) speak on a non-empty object and reject other root types; the content-
      presence adapter (custom1) speaks on a non-empty string — declared gate modes, never
      raw truthiness.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.2"
      - "src/xubb_agents/core/insight_validation.py: evaluate_gate / resolve_gate_mode"
