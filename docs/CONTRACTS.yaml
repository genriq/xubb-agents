    test_domain_fatal: "tests/test_typed_acceptance_g1.py::TestTypedAtomicity::test_invalid_domain_payload_rejects_typed_too"
    test_valid_commits: "tests/test_typed_acceptance_g1.py::TestTypedAtomicity::test_valid_response_commits_everything"
    test_gates: "tests/test_typed_acceptance_g1.py::TestTypedGates::test_non_boolean_gate_rejects_whole_response"
    test_inconsistent_gate: "tests/test_typed_acceptance_g1.py::TestTypedGates::test_false_gate_with_candidate_is_inconsistent"
    test_exact_types: "tests/test_typed_acceptance_g1.py::TestTypedTypeValues::test_label_rejects_whole_response"
    status: covered   # G1 part 2.

  - id: TYPED-SCHEMA-DERIVATION
    statement: >
      Local typed-candidate validation agrees with the packaged authoritative JSON
      Schema (docs/reference/insight_types_1.2.0/normalized_insight.schema.json) on every
      packaged shape fixture, with exactly one documented divergence: the provider-shaped
      envelope requires every candidate key to be present, while the local contract
      tolerates omission and applies the documented defaults.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.3, §13.3"
      - "tests/fixtures/insight_contract_1.2.0/ (manifest-verified package fixtures)"
    test: "tests/test_typed_acceptance_g1.py::TestSchemaDerivation::test_local_validator_agrees_with_normalized_schema_on_every_fixture"
    status: covered   # G1 part 2.

  - id: INSIGHT-CONFIG-LOAD-TIME
    statement: >
      Per-agent insight_config is a typed block (extra=forbid): allowed_types are
      human-facing wire values (default: the six ordinary purposes; [] = state-only,
      never "all"); a malformed block fails DynamicAgent construction with
      AgentConfigurationError; a contradiction between an interactive flag and its
      allowed_types membership fails register_agent/replace_agents before any registry
      mutation (all-or-nothing). Flags never implicitly expand allowed_types.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §7.1, §7.2"
      - "src/xubb_agents/core/models.py: InsightConfig"
