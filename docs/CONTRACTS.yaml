  - id: EVIDENCE-COORDINATES-AND-CITATIONS
    statement: >
      A framework-built segment reference resolves to the segment's position in the
      recent_segments list the host passed for the execution (recorded before trimming);
      the engine stamps source_index on accepted segment references (null for other
      kinds) and on the snapshot entries with their timestamps; a model-authored
      source_index rejects; a producer-set one is rejected at the boundary; an unexposed
      ordinal still rejects; HostInsightCapabilities.evidence_citations exposes the
      citation markers and the reference contract on every typed run.
    source:
      - "src/xubb_agents/core/insight_validation.py: snapshot_catalog, ReferenceContext.coordinates, validate_typed_candidate"
      - "src/xubb_agents/library/dynamic.py: evaluate (cite, first_index), _build_reference_context"
      - "src/xubb_agents/core/engine.py: _enforce_typed, _candidate_projection, _boundary_reference_context"
      - "src/xubb_agents/core/models.py: EvidenceRef.source_index, EvidenceCatalogEntry, HostInsightCapabilities.evidence_citations"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.4"
    invariant: INV-50
    test: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_segment_references_are_stamped_with_the_host_list_position"
    test_full_window: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_full_window_starts_at_zero_and_documents_carry_no_coordinate"
    test_capability: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_evidence_citations_capability_exposes_the_markers_on_a_general_run"
    test_control_unexposed: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_control_unexposed_ordinal_still_rejects"
    test_control_authored: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_control_model_authored_source_index_rejects_the_response"
    test_control_producer: "tests/test_typed_reach_2_8.py::TestEvidenceCoordinates::test_control_custom_producer_cannot_stamp_a_coordinate"
    status: covered   # v2.8 EC-1

  - id: ISOLATED-INSTRUCTION-RESULT-ONLY
    statement: >
      On the isolated content path the generated instruction offers the insight
      envelope only — no domain channel, no sidecar, no scratchpad section — and states
      the request is result-only; the live-turn instruction keeps its channels. The
      result-only guard rejects effects returned anyway, independently of the prompt.
    source:
      - "src/xubb_agents/library/dynamic.py: evaluate (isolated), _typed_instruction"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.5"
    invariant: INV-51
    test: "tests/test_typed_reach_2_8.py::TestIsolatedInstruction::test_isolated_prompt_offers_the_envelope_only_and_no_scratchpad"
    test_control: "tests/test_typed_reach_2_8.py::TestIsolatedInstruction::test_control_channels_returned_anyway_still_reject_the_result"
    status: covered   # v2.8 IC-1

  - id: URGENCY-PROVENANCE
    statement: >
      urgency_provided is true only when the accepted candidate carried a valid explicit
      urgency; the agent default and the per-type fallback yield false; a candidate or a
      producer carrying the flag is rejected as engine-owned; a producer without trusted
      staging has unknown provenance (false); the legacy projection and legacy emissions
      carry no flag; an invalid explicit urgency still rejects.
    source:
      - "src/xubb_agents/core/insight_validation.py: validate_typed_candidate (urgency_provided)"
      - "src/xubb_agents/library/dynamic.py: _stage_typed (staged hand-over)"
      - "src/xubb_agents/core/engine.py: _enforce_typed (stamp), ENGINE_OWNED_PUBLIC_FIELDS"
      - "src/xubb_agents/core/models.py: AgentInsight.urgency_provided"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.6"
    invariant: INV-52
    test: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_explicit_urgency_is_provided"
    test_default: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_agent_default_is_not_provided"
    test_fallback: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_type_fallback_is_not_provided"
    test_candidate_flag: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_candidate_carrying_the_flag_rejects"
    test_producer_flag: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_custom_producer_cannot_set_the_flag"
    test_unknown_provenance: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_custom_producer_without_staging_has_unknown_provenance"
    test_legacy: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_legacy_projection_and_legacy_emission_carry_no_flag"
    test_control: "tests/test_typed_reach_2_8.py::TestUrgencyProvenance::test_control_invalid_explicit_urgency_still_rejects"
