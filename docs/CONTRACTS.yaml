    test_declared: "tests/test_typed_acceptance_g1.py::TestConfidence::test_declared_estimate_is_kept_with_provenance"
    test_public_shape: "tests/test_typed_acceptance_g1.py::TestConfidence::test_public_serialization_numeric_plus_flag_and_legacy_projection"
