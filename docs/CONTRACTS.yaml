  - id: MAP-ENTRIES-CODEC
    statement: >
      Open-ended dictionaries cross the strict provider schema as map_entries_v1
      ({"entries": [{"key", "value"}...]}, nested maps recursing) and decode losslessly —
      scalars, arrays, nulls and nested maps preserved; duplicate keys, non-finite
      numbers, malformed envelopes and excessive depth reject with a codec code, which
      the typed path reports as a fatal invalid_domain_payload. No domain update is
      silently dropped to satisfy a closed schema.
