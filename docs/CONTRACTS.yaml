  - id: CONTENT-RESULT-AFTER-RELEASE
    statement: >
      await handle.result() returns only after the content task's capacity slot has been
      released (completion, cancellation, refusal alike), so a replacement admits at
      once; handle.released is the same point as an awaitable. Without the release
      signal, result() would not return (negative control).
    source:
      - "src/xubb_agents/core/engine.py: ContentTaskHandle.result / released, _release_content_task, start_content_request (refuse)"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.7"
    invariant: INV-53
    test: "tests/test_typed_reach_2_8.py::TestContentSlotOrdering::test_result_returns_only_after_the_slot_is_released_so_a_replacement_admits_at_once"
    test_released: "tests/test_typed_reach_2_8.py::TestContentSlotOrdering::test_released_alone_marks_the_same_point"
    test_exits: "tests/test_typed_reach_2_8.py::TestContentSlotOrdering::test_completed_task_and_refused_handle_release"
    test_control: "tests/test_typed_reach_2_8.py::TestContentSlotOrdering::test_control_without_the_release_signal_result_would_not_return"
    status: covered   # v2.8 CS-1

  - id: CORRECTABLE-TARGETS
    statement: >
      A retained record with correctable=false is never offered as a correction target and
      a correction naming it is rejected (invalid_correction_target / target_not_correctable);
      the same record with correctable=true is offered and corrected; answers keep
      validating against a non-correctable question; an unknown target is still unknown.
    source:
      - "src/xubb_agents/core/models.py: PriorInsightRecord.correctable"
      - "src/xubb_agents/core/insight_validation.py: validate_correction_target"
      - "src/xubb_agents/library/dynamic.py: evaluate (offered records)"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.8"
    invariant: INV-54
    test: "tests/test_typed_reach_2_8.py::TestCorrectableTargets::test_correction_naming_a_non_correctable_record_is_rejected"
    test_not_offered: "tests/test_typed_reach_2_8.py::TestCorrectableTargets::test_non_correctable_record_is_not_offered"
    test_offered: "tests/test_typed_reach_2_8.py::TestCorrectableTargets::test_correctable_record_is_offered_and_corrected"
    test_answers: "tests/test_typed_reach_2_8.py::TestCorrectableTargets::test_answers_still_validate_against_a_non_correctable_question"
    test_control: "tests/test_typed_reach_2_8.py::TestCorrectableTargets::test_control_unknown_target_is_still_unknown"
    status: covered   # v2.8 CT-1

  - id: DATA-BY-AGENT
    statement: >
      On an aggregated response data_by_agent attributes every committed sidecar to the
      agent that produced it (a copy, never an alias); the merged data keeps its shape; a
      rejected agent contributes to neither; per-agent responses leave it empty.
    source:
      - "src/xubb_agents/core/engine.py: _merge (data_by_agent)"
      - "src/xubb_agents/core/models.py: AgentResponse.data_by_agent"
      - "docs/SPEC_V2_8_TYPED_REACH.md: §3.9"
    invariant: INV-55
    test: "tests/test_typed_reach_2_8.py::TestDataByAgent::test_each_agents_sidecar_is_attributed_and_the_merge_keeps_its_shape"
    test_rejected: "tests/test_typed_reach_2_8.py::TestDataByAgent::test_rejected_agent_contributes_to_neither"
    test_per_agent: "tests/test_typed_reach_2_8.py::TestDataByAgent::test_per_agent_responses_leave_it_empty"
    test_control: "tests/test_typed_reach_2_8.py::TestDataByAgent::test_control_attribution_is_a_copy_not_an_alias"
    status: covered   # v2.8 DS-1

