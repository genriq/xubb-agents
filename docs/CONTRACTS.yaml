    test_frozen: "tests/test_insight_vocabulary_g1.py::TestContextPropagation::test_phase_copy_cannot_mutate_the_host_declaration"
    status: covered   # G1 part 1 (principal_id + insight_capabilities; later extensions register as they land).

  - id: INSIGHT-CONTRACT-SELECTION
    statement: >
      AgentEngine(insight_contract=...) accepts exactly {"legacy_v2", "typed_v1"}; the
      default is legacy_v2 in the current major; any other value is a ValueError. The
      engine injects the selected contract into every registered agent. Under typed_v1 a
      DynamicAgent may register only with a schema declaring a typed adapter
      (insight_v1, default_v2, v2_raw) and able to carry the fields its insight_config
      needs; insight_v1 is typed-only. Mismatches fail at registration, never at runtime.
    source:
