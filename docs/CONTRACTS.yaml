    test_unknown: "tests/test_insight_vocabulary_g1.py::TestContractSelection::test_unknown_contract_is_a_value_error"
    test_adapter_gate: "tests/test_typed_acceptance_g1.py::TestTypedRegistration::test_schema_without_typed_adapter_fails_at_registration"
    test_typed_only_schema: "tests/test_typed_acceptance_g1.py::TestTypedRegistration::test_insight_v1_is_typed_only"
    status: covered   # G1 part 2: typed_v1 selectable; adapter gating at registration.

  # ---- XUBB-ITC-1 — G1 part 2: typed acceptance (typed_v1) ----

  - id: ITC-03.FW-prompt-schema-vocabulary-agree
    statement: >
      Under typed_v1 the instruction sent to the model is GENERATED per run and lists
      exactly the effective type set (framework ∩ agent ∩ schema ∩ host ∩ prerequisites
      ∩ implemented); the schema's static instruction with its legacy literal enum is not
      sent; no unoffered value appears; an empty effective set yields a silence-only
      envelope, never an empty enum.
    source:
