    test_legacy_memory_path: "tests/test_legacy_acceptance_g0.py::TestNoParseTimeMutation::test_legacy_default_schema_memory_path_stages_merged_view_without_mutation"
    test_rejected_writes_nothing: "tests/test_legacy_acceptance_g0.py::TestNoParseTimeMutation::test_rejected_response_writes_nothing_to_memory"
    test_partial_observable: "tests/test_legacy_acceptance_g0.py::TestNoParseTimeMutation::test_partial_status_is_serializable_and_engine_derived"
    test_envelope_rejected_usage_kept: "tests/test_legacy_acceptance_g0.py::TestNoParseTimeMutation::test_invalid_envelope_is_rejected_and_usage_survives"
    test_invalid_domain_fatal: "tests/test_legacy_acceptance_g0.py::TestFatalRejection::test_invalid_domain_payload_rejects_whole_response"
    test_unit_table: "tests/test_insight_validation.py::TestDecideLegacy::test_fatal_domain_issue_rejects_everything_even_with_valid_insight"
    status: covered   # G0: negative control = parse-time private_state.update() fails.

  # ---- XUBB-ITC-1 — G1 part 1: vocabulary, alias, contract selection, config (inert on the wire) ----

  - id: ITC-01.FW-nine-human-purposes
    statement: >
      HUMAN_INSIGHT_TYPES names exactly nine human-facing purposes (information/fact,
      observation, suggestion, warning, opportunity, praise, reply, correction, question)
      in canonical order; ERROR is excluded and type-offering code never uses
      unrestricted enum iteration.
    source:
