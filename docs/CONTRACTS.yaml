    test_multi_target: "tests/test_corrections_g3.py::TestArbitration::test_multi_target_is_all_or_nothing"
    test_duplicates: "tests/test_corrections_g3.py::TestArbitration::test_duplicate_targets_within_one_response_reject_it"
    test_phase_reservation: "tests/test_corrections_g3.py::TestArbitration::test_earlier_phase_reservation_cannot_be_overturned_by_phase_two"
    test_no_conflict: "tests/test_corrections_g3.py::TestArbitration::test_no_conflict_means_all_commit"
    test_reset: "tests/test_corrections_g3.py::TestArbitration::test_reservations_reset_each_turn"
    test_dynamic: "tests/test_corrections_g3.py::TestArbitration::test_dynamic_agents_arbitrate_too"
    status: covered   # G3 part 2. Deadline closure of the arbitration set arrives with the delivery workstream (DL-2).

  # ---- XUBB-ITC-1 — C1: the long-form content contract long_form_v1 (§14.4–§14.10) ----

  - id: CONTENT-POLICY-DERIVATION
    statement: >
      The framework's content policy (core/content_contract.py) is the reference policy:
      it reproduces all 62 packaged content fixtures — negotiation, policy validity,
      depth resolution, admission, completion, exact limits, format — and never edits or
      truncates a submitted body. Completion status derives from trusted adapter
      telemetry (stop = complete; length / truncated = incomplete; failure = failed;
      unreported = unknown), never from model metadata.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §14.5–§14.7"
      - "src/xubb_agents/core/content_contract.py"
