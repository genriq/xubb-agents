    test_fresh_instance: "tests/test_isolated_content_c2.py::TestIsolatedPath::test_fresh_instance_no_shared_state_and_live_agent_unused"
    test_declaration_refused: "tests/test_isolated_content_c2.py::TestIsolatedPath::test_host_authored_isolated_declaration_is_refused"
