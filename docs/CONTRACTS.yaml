  - id: INTERACTIVE-PRINCIPAL-IDENTITY
    statement: >
      Interactive operations require a present, matching current principal taken from
      the frozen invocation context: an answer is accepted only when the current
      principal is present and equals both the question record's and the answer's
      principal; a correction target is valid only when the current principal is present
      and equals the record's; correction capability, like reply and question, is
      unavailable without a principal (missing_principal). A missing identity on either
      side disables the operation — it is never a wildcard.
