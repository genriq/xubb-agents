    test_agent_set: "tests/test_typed_acceptance_g1.py::TestCapabilityIntersection::test_agent_allowed_types_restrict"
    test_host_set: "tests/test_typed_acceptance_g1.py::TestCapabilityIntersection::test_host_without_observation_declaration_restricts"
    test_run_specific: "tests/test_typed_acceptance_g1.py::TestCapabilityIntersection::test_missing_principal_is_a_run_specific_capability_diagnostic"
    test_implementation_gate: "tests/test_typed_acceptance_g1.py::TestCapabilityIntersection::test_unimplemented_interactive_type_stays_unavailable_even_when_permitted"
    test_custom_agent: "tests/test_typed_acceptance_g1.py::TestCapabilityIntersection::test_custom_agent_is_held_to_the_same_set"
    status: covered   # G1 part 2.

  - id: ITC-08.FW-empty-set-is-state-only
    statement: >
      An empty effective set (e.g. allowed_types=[]) is state-only: the generated
      instruction is a silence-only envelope with no type enum, a valid false gate still
      commits state (accepted_silent), and any candidate is rejected — never relabelled,
      never treated as "all types".
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §7.1, §7.3"
      - "src/xubb_agents/library/dynamic.py: _typed_instruction / _stage_typed"
    invariant: ITC-08.FW
