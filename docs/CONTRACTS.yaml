    test_labels: "tests/test_insight_vocabulary_g1.py::TestInformationAlias::test_display_label_comes_from_explicit_map_not_name"
    test_future_wire: "tests/test_insight_vocabulary_g1.py::TestInformationAlias::test_future_information_wire_value_is_not_accepted"
    status: covered   # G1 part 1.

  - id: ITC-14.FW-context-extensions-propagate
    statement: >
      Trusted host inputs on AgentContext (principal_id, insight_capabilities) are
      frozen before a run and reach every agent unchanged in Phase 1 and Phase 2 via
      the phase-context copy; an agent mutating its copy cannot alter the host-owned
      declaration on the live context.
    source:
