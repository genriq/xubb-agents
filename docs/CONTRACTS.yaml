  - id: ITC-30.FW-incomplete-generation-rejected
    statement: >
      Only a COMPLETE generation (trusted adapter telemetry) may emit an extended insight:
      a parseable body with finish_reason=length is incomplete_generation, an unreported
      completion is completion_unknown, and model metadata cannot assert completeness.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §14.7"
