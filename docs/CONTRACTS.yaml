    test_model_supplied: "tests/test_typed_acceptance_g1.py::TestIdentity::test_model_supplied_identity_rejects"
    test_metadata: "tests/test_typed_acceptance_g1.py::TestIdentity::test_metadata_cannot_carry_engine_owned_provenance"
    test_custom_mint: "tests/test_typed_acceptance_g1.py::TestIdentity::test_custom_agent_cannot_mint_its_own_id"
    test_custom_stamped: "tests/test_typed_acceptance_g1.py::TestIdentity::test_custom_agent_insight_is_stamped_and_provenance_unknown_is_false"
    status: covered   # G1 part 2.

  - id: ITC-10.FW-confidence-strict-provenance-neutral-ranking
    statement: >
      Typed confidence input accepts only a finite number in [0,1] (booleans, numeric
      strings, NaN, infinities and out-of-range values reject); omitted/null is "not
      provided": public confidence is the numeric placeholder 1.0 with runtime-derived
      confidence_provided=false (never an estimate; unknown provenance is false). The
      public shape stays numeric plus the flag; model_dump_legacy() projects the v2.6
      wire shape. The D-CR default rank key (urgency_order, -agent_priority,
      stable_merge_order) ignores confidence for every candidate; the engine stamps the
      stable merge order as (phase, registered-agent index, ordinal), never arrival.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §6.2, §6.6"
      - "docs/INSIGHT_TYPES_FINAL_DECISIONS.md: D-CR"
