    test_refusal: "tests/test_provider_schema_g2.py::TestClientTransport::test_refusal_is_its_own_category_with_usage"
    test_fixtures: "tests/test_provider_schema_g2.py::TestFallbackPolicy::test_packaged_fallback_fixtures_reproduce"
    test_engine_observable: "tests/test_provider_schema_g2.py::TestEngineStrictTransport::test_auto_fail_closed_is_observable_on_the_response"
    test_engine_downgrade: "tests/test_provider_schema_g2.py::TestEngineStrictTransport::test_auto_downgrade_is_recorded_on_the_response_and_reused"
