  # ---- XUBB-ITC-1 — G2 part 1: per-agent snapshot evidence catalog ----

  - id: ITC-15.FW-references-resolve-to-exposed-evidence
    statement: >
      Under typed_v1 the framework builds, per agent and per invocation, a snapshot
      catalog of the material ACTUALLY exposed to the model (the trimmed transcript
      window and the RAG documents it received), with one reference per occurrence
      (snap:<id>:segment:<n>, never deduplicated) and copied sources; host-supplied
      records (documents, facts, prior emitted insights) join it for this session.
      An evidence reference resolves only to an entry of that catalog at its revision:
      an id nothing exposed, a stale/mismatched revision, or an entry owned by another
      session rejects (unknown_reference / cross_session_reference). Snapshot ids differ
      per invocation and are returned as a retention aid, not a durable identity.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §6.3, §6.4"
      - "src/xubb_agents/core/insight_validation.py: snapshot_catalog / ReferenceContext"
