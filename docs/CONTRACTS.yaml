    test_missing_gate: "tests/test_legacy_acceptance_g0.py::TestStrictBooleanGate::test_missing_required_gate_is_an_insight_error"
    test_root_presence: "tests/test_legacy_acceptance_g0.py::TestStrictBooleanGate::test_root_presence_adapter_rejects_non_object_root"
    test_content_presence: "tests/test_legacy_acceptance_g0.py::TestStrictBooleanGate::test_custom1_content_presence_gate_is_declared_not_truthiness"
    test_unit: "tests/test_insight_validation.py::TestBooleanGate::test_non_boolean_values_are_invalid_never_speech"
    status: covered   # G0: negative control = the superseded truthiness rule ("false" speaks) fails.

  - id: ITC-05.FW-silence-preserves-state
    statement: >
      A valid false gate is deliberate silence, not failure: the response's independently
      validated domain channels (facts, variables, queues, events, memory) commit and the
      result is accepted_silent with no diagnostic and no validation callback. Silence is
      distinguishable from rejection in acceptance_by_agent.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.2, §8.6"
      - "src/xubb_agents/core/insight_validation.py: decide_legacy"
    invariant: ITC-05.FW
