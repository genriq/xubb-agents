    test_legacy_control: "tests/test_boundary_hardening_h1.py::TestTypedFailures::test_legacy_error_card_surface_is_unchanged"
    test_forged: "tests/test_boundary_hardening_h1.py::TestTypedFailures::test_forged_framework_error_on_an_accepted_typed_result_is_rejected"
    status: covered   # H1. Closes audit XA-07.

  # ---- H2 — audit hardening: content path and assurance (audit of e3dfaf1, XA-04/05/06/08) ----

  - id: CONTENT-ENTRYPOINT-ADMISSION
    statement: >
      AgentEngine.start_content_request admits a request BEFORE any allocation — no
      snapshot copy, no clone, no task, no model call until it passes: the typed contract
      is active; the agent is isolatable (re-instantiable from its definition and able to
      report content admission); the content contract is negotiated for THIS request
      (agent content block, schema support, host content capability incl. expanded
      reading, requested depth, the engine's own isolated declaration) via the agent's
      pure admission check on a shallow view; and capacity is available. A refusal is an
      immediate rejected ContentResult carried by a task-less handle
      (content_contract_unavailable / content_execution_not_allowed / the plan's codes).
    source:
