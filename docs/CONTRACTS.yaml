    status: covered   # C1.

  - id: ITC-33.FW-extension-requires-explicit-support
    statement: >
      long_form_v1 is enabled for a run only when the agent declares insight_config.content,
      the schema adapter declares the contract and the host declares content_contracts +
      expanded_reading + positive limits, under typed_v1 with a finite operator byte
      ceiling; a content block on a legacy engine or an unsupporting schema fails
      registration; an unsupporting host rejects before any call
      (content_contract_unavailable); non-negotiated runs still reject preview /
      content_format (content_extension_not_enabled) and emit no extension fields.
