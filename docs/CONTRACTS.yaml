    test_force: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_force_is_not_isolation"
    test_pause: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_declared_pause_admits_detailed_with_its_own_budget"
    test_pause_declared: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_pause_must_be_declared_and_post_session_is_fine"
    test_missing_context: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_missing_execution_context_rejects"
    test_isolated_gate: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_host_declared_isolated_path_is_refused"
    test_depth_and_evasion: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_unsupported_depth_and_brief_profile_evasion"
    test_default: "tests/test_long_form_c1.py::TestDepthAndAdmission::test_brief_default_in_live_session"
    status: covered   # C1. Isolated active execution (C2) not claimed.

  - id: ITC-29.FW-exact-limits-never-truncate
    statement: >
      Body and preview limits are decoded code points, the most restrictive of profile,
      host and operator; exactly the limit passes, one over rejects (content_too_large /
      preview_too_large) with nothing shortened; the response-byte ceiling is checked on
      the transport byte count (response_too_large); an unsupported or un-negotiated
      format is unsupported_content_format.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §14.5–§14.7"
    invariant: ITC-29.FW
    test: "tests/test_long_form_c1.py::TestBodyPreviewAndLimits::test_exact_character_boundaries_never_truncate"
