    test_config: "tests/test_insight_vocabulary_g1.py::TestInsightConfig::test_empty_allowed_types_is_state_only_not_all"
    status: covered   # G1 part 2.

  - id: ITC-09.FW-engine-minted-identity
    statement: >
      Under typed_v1 every accepted human-facing insight receives an engine-minted
      session-unique id, the host's turn_count as turn, and contract_version "typed_v1",
      preserved through merge and serialization. A candidate or custom agent supplying
      any engine-owned field (id, turn, contract_version, confidence_provided,
      acceptance_status, source_snapshot_id, …), at the root or in metadata, rejects the
      response.
