    test_distinct_from_rejection: "tests/test_legacy_acceptance_g0.py::TestValidSilencePreservesState::test_silence_is_distinguishable_from_rejection"
    test_unit: "tests/test_insight_validation.py::TestDecideLegacy::test_accepted_silent"
    status: covered   # G0.

  - id: ITC-06.FW-unknown-type-rejects-no-relabel
    statement: >
      An unrecognised type label (unknown_type) or a recognised-but-disallowed wire value
      on the legacy path — error, observation, reply, correction, question (type_not_allowed)
      — rejects every insight from that result and NEVER relabels it as suggestion,
      information, observation or any other purpose. Independently valid channels commit
      (partial); with none, the response is rejected. The diagnostic carries a bounded
      classification, never the content. Case-folding and the absent-type default
      ("suggestion") are declared legacy adapter normalisations, not relabels.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.6 (D-LR)"
      - "docs/INSIGHT_TYPES_FINAL_DECISIONS.md: D-LR"
      - "src/xubb_agents/core/insight_validation.py: normalize_legacy_type"
    invariant: ITC-06.FW
    test: "tests/test_legacy_acceptance_g0.py::TestUnknownTypeRejectsWithoutRelabel::test_label_rejects_insight_keeps_valid_state_partial"
    test_rejected_whole: "tests/test_legacy_acceptance_g0.py::TestUnknownTypeRejectsWithoutRelabel::test_unknown_type_without_state_is_rejected_whole"
    test_sidecar_withheld: "tests/test_legacy_acceptance_g0.py::TestUnknownTypeRejectsWithoutRelabel::test_partial_withholds_action_bearing_sidecar"
    test_unit: "tests/test_insight_validation.py::TestLegacyTypeNormalization::test_unknown_labels_reject_and_never_relabel"
    test_unit_no_emit: "tests/test_insight_validation.py::TestDecideLegacy::test_partial_never_emits_an_insight"
    status: covered   # G0: negative control = the superseded unknown→SUGGESTION fallback fails.

  - id: ITC-13.FW-one-rejection-callback-per-result
    statement: >
      The engine is the single emitter of on_insight_validation_error: exactly one
      invocation per agent execution result whose status is partial or rejected, none for
      accepted / accepted_silent; every detail is correlated on the aggregate
      AgentResponse.diagnostics. A raising callback cannot release rejected content or
      block the turn. (Legacy_v2 scope at G0; typed_v1 atomic rejection lands at G1.)
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.5, §14"
      - "src/xubb_agents/core/engine.py: _run_agent_safe"
      - "src/xubb_agents/core/callbacks.py: on_insight_validation_error"
    invariant: ITC-13.FW
