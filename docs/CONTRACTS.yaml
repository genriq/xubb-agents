    test_reference_fixtures: "tests/test_typed_acceptance_g1.py::TestAmendmentFixtures::test_reference_policy_fixtures_reproduce"
    status: covered   # G1 part 2 (D-CR).

  - id: ITC-11.FW-urgency-precedence
    statement: >
      Urgency resolves as: valid explicit value → configured agent default_urgency →
      versioned per-type fallback (warning/opportunity/reply/correction now;
      suggestion/praise/question soon; fact/observation whenever). A present-but-invalid
      explicit value (including null) rejects the response and is never defaulted.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §6.6"
      - "src/xubb_agents/core/insight_validation.py: resolve_urgency / TYPE_URGENCY_FALLBACK"
    invariant: ITC-11.FW
    test: "tests/test_typed_acceptance_g1.py::TestUrgency::test_invalid_explicit_rejects_never_defaults"
    test_explicit: "tests/test_typed_acceptance_g1.py::TestUrgency::test_explicit_wins"
    test_precedence: "tests/test_typed_acceptance_g1.py::TestUrgency::test_agent_override_then_type_fallback"
    test_table: "tests/test_typed_acceptance_g1.py::TestUrgency::test_fallback_table_is_versioned"
    status: covered   # G1 part 2.

  - id: ITC-12.FW-typed-atomic-rejection
    statement: >
      Under typed_v1 any invalid candidate, malformed or inconsistent gate, unknown or
      disallowed type, or invalid domain payload makes the entire agent response
      non-committable: no insights, facts, variables, events, queues, sidecars or memory
      from it are applied and private state is untouched; usage and sanitized
      diagnostics survive; one validation callback fires. Valid silence still commits.
    source:
