      custom1 fails registration under typed_v1 with a message naming the schema, its
      typed_unsupported_reason and the six typed adapters; nothing registers; the schema
      still registers under legacy_v2; every other shipped schema registers under
      typed_v1; a typed declaration without a typed_adapter is a distinct refusal.
