    test_shape: "tests/test_reply_question_g3.py::TestBatchIdempotency::test_model_rejects_unknown_fields_on_answers"
    status: covered   # G3 part 1. ITC-22.HOST (durable dedup) is a conformance run, not claimed.

  # ---- XUBB-ITC-1 — G3 part 2: the correction lifecycle (§10) ----

  - id: ITC-18.FW-correction-targets-prior-active-same-principal
    statement: >
      A CORRECTION is available only with allow_correction, host corrections and a
      retained history snapshot this run (otherwise capability_unavailable
      missing_history). Its target must resolve, at the engine boundary for DynamicAgent
      and custom agents alike, to a previously emitted human-facing insight from an
      EARLIER turn, in this session, still active, for the same principal; same-turn and
      cross-session targets are deferred (rejected). Authority is the agent's own output
      unless the host's allowlisted policy names the agent; nothing in the payload or
      metadata widens it. A separate evidence basis is required and must resolve. Any
      violation rejects the whole response (typed atomicity); a failed correction is never
      turned into another card.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §10.1, §10.2"
      - "src/xubb_agents/core/insight_validation.py: validate_correction_target"
      - "src/xubb_agents/core/engine.py: _enforce_typed"
    invariant: ITC-18.FW
    test: "tests/test_corrections_g3.py::TestTargetValidation::test_invalid_targets_reject_whole_response"
    test_accepted: "tests/test_corrections_g3.py::TestTargetValidation::test_valid_self_correction_is_accepted"
    test_withdraw: "tests/test_corrections_g3.py::TestTargetValidation::test_withdraw_is_accepted"
    test_allowlist: "tests/test_corrections_g3.py::TestTargetValidation::test_allowlisted_agent_may_repair_another_agents_insight"
    test_no_self_grant: "tests/test_corrections_g3.py::TestTargetValidation::test_model_cannot_grant_itself_authority"
    test_basis: "tests/test_corrections_g3.py::TestTargetValidation::test_basis_is_required_and_must_resolve"
    test_payload_rules: "tests/test_corrections_g3.py::TestTargetValidation::test_correction_payload_on_other_types_and_missing_payload_reject"
    test_pure: "tests/test_corrections_g3.py::TestTargetValidation::test_pure_validator_rules"
    test_history_required: "tests/test_corrections_g3.py::TestAvailability::test_no_history_this_run_is_capability_unavailable"
    test_prompt: "tests/test_corrections_g3.py::TestTargetValidation::test_prompt_lists_own_correctable_messages_only"
    status: covered   # G3 part 2. Host delivery (ITC-18/19.HOST) is a conformance run, not claimed.

  - id: ITC-20.FW-correction-arbitration-whole-response
    statement: >
      Correction-bearing responses are held whole and arbitrated at phase close before
      anything from the phase commits: complete accepted responses carrying corrections
      are ordered by descending agent priority, then later registration (never arrival);
      a response is accepted only when ALL its targets are unreserved and then reserves
      them together; otherwise it is rejected whole with correction_conflict — no sibling
      insight, state, fact, event, memory or sidecar from it commits, and exactly one
      validation callback fires. Duplicate targets within one response reject it.
      Reservations from an earlier phase of the same turn cannot be overturned by a later
      phase; reservations reset each turn.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §10.3 (A2-7)"
      - "src/xubb_agents/core/engine.py: _arbitrate_corrections"
    invariant: ITC-20.FW
    test: "tests/test_corrections_g3.py::TestArbitration::test_higher_priority_wins_loser_commits_nothing"
