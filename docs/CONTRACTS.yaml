    test_invalid_domain_fatal: "tests/test_legacy_acceptance_g0.py::TestFatalRejection::test_invalid_domain_payload_rejects_whole_response"
    test_unit_table: "tests/test_insight_validation.py::TestDecideLegacy::test_fatal_domain_issue_rejects_everything_even_with_valid_insight"
    status: covered   # G0: negative control = parse-time private_state.update() fails.

  # ---- XUBB-ITC-1 — G1 part 1: vocabulary, alias, contract selection, config (inert on the wire) ----

  - id: ITC-01.FW-nine-human-purposes
    statement: >
      HUMAN_INSIGHT_TYPES names exactly nine human-facing purposes (information/fact,
