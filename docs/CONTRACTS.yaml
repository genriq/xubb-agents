    test_debug_channel: "tests/test_legacy_acceptance_g0.py::TestErrorProvenance::test_raw_exception_lives_only_in_protected_debug_channel"
    test_forged_dropped: "tests/test_legacy_acceptance_g0.py::TestErrorProvenance::test_agent_authored_error_insight_is_dropped_at_boundary"
    test_metadata_cannot_forge: "tests/test_legacy_acceptance_g0.py::TestErrorProvenance::test_metadata_origin_cannot_forge_framework_provenance"
    test_model_error_rejected: "tests/test_legacy_acceptance_g0.py::TestUnknownTypeRejectsWithoutRelabel::test_label_rejects_insight_keeps_valid_state_partial"
    status: covered   # G0: negative control = str(e) in insight content fails.

  - id: ITC-24.FW-legacy-partial-acceptance-no-parse-mutation
    statement: >
      D-LR on the legacy_v2 path: a recoverable insight error rejects the insight
      component only; independently validated, authorized channels commit with an explicit,
      serializable, engine-derived partial status (never reported as delivery or silence);
      action-bearing data sidecars are withheld. Fatal rows (invalid domain payload,
      reserved-state write, unparseable envelope) reject the whole response. In NO mode does
      parsing mutate DynamicAgent.private_state or the Blackboard: memory becomes durable
      only through the engine merge, and a rejected response writes nothing. Usage and
      diagnostics survive rejection.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §8.4, §8.6"
      - "docs/INSIGHT_TYPES_FINAL_DECISIONS.md: D-LR"
