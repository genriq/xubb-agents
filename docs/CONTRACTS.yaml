    test_silence_acts: "tests/test_typed_reach_2_8.py::TestRootV2Sidecar::test_silence_with_actions_commits_the_sidecar"
    test_silence_envelope: "tests/test_typed_reach_2_8.py::TestRootV2Sidecar::test_silence_only_envelope_keeps_the_sidecar"
