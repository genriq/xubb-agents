    test_completion: "tests/test_long_form_c1.py::TestPackagedFixtures::test_completion_status_from_telemetry"
    status: covered   # C1.

  - id: ITC-26.FW-length-independent-of-type
    statement: >
      Under long_form_v1 an extended body keeps the purpose the candidate declared; no
      length-based type, subtype or relabel exists.
    source:
      - "docs/SPEC_INSIGHT_TYPES.md: §14.4"
    invariant: ITC-26.FW
