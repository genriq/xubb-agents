  # ---- H1 — audit hardening: enforcement and identity (audit of e3dfaf1, XA-01/02/03/07) ----

  - id: BOUNDARY-UNIFIED-ACCEPTANCE
    statement: >
      The engine boundary is ONE authoritative acceptance pipeline for every producer —
      DynamicAgent staging, custom BaseAgent subclasses and callback-modified responses.
      Under typed_v1 the producer-controlled projection of every insight is re-run
      through the strict candidate validator (type, content, confidence, urgency,
      metadata, analytical fields, interactive payloads, evidence resolution, content
      extension) against the run's effective set, profile and reference context; every
      engine-owned public field (id, turn, contract_version, confidence_provided,
      content_contract, response_depth, content_request_id, source_snapshot_id) must be
      unset — trusted staging hands its runtime-derived values over privately and the
      engine stamps them after validation; reference authority comes from the invocation
      (host records + this run's own snapshot held by the agent), never from a snapshot
      attached to the response. In BOTH contracts the domain channels of the object that
      would commit are shape-revalidated (events, variable_updates, queue_pushes, facts
      incl. confidence, memory_updates, state_updates, data) with reserved sys.* writes;
      a fatal domain error rejects the whole response, typed atomicity holds, and D-LR
      legacy partial acceptance for recoverable insight errors is preserved.
    source:
      - "src/xubb_agents/core/engine.py: _enforce_acceptance / _enforce_typed / _candidate_projection / _boundary_reference_context"
      - "src/xubb_agents/core/insight_validation.py: validate_typed_candidate / validate_response_channels"
      - "src/xubb_agents/library/dynamic.py: _stage_typed (private hand-over)"
    invariant: INV-38
    test: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_custom_question_without_payload_rejects_whole_response"
    test_control: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_control_valid_custom_insight_is_accepted_and_stamped"
    test_hypothesis: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_custom_hypothesis_needs_evidence_rationale_and_validation_step"
    test_mutation: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_mutated_custom_output_is_revalidated"
    test_engine_owned: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_engine_owned_public_fields_cannot_be_producer_set"
    test_callback: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_finish_callback_mutation_is_caught_for_dynamic_agents_too"
    test_staged: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_staged_provenance_and_content_fields_survive_the_unified_boundary"
    test_domain: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_domain_channels_are_revalidated_on_the_object_that_commits"
    test_legacy_partial: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_legacy_keeps_partial_acceptance_for_recoverable_insight_errors"
    test_reference_authority: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_reference_authority_comes_from_the_invocation_not_the_response"
    test_host_records: "tests/test_boundary_hardening_h1.py::TestUnifiedBoundary::test_host_records_still_resolve_for_custom_agents"
    status: covered   # H1. Closes audit XA-01.

  - id: ANSWER-VISIBILITY-SCOPED
    statement: >
      Per-agent answer visibility is decided by the engine on the invocation view each
      agent receives — from the frozen context and the retained question records — so it
      holds through direct context access, template aliases of the full context, custom
      agents and isolated content tasks; a validated answer is visible only to the agent
      that asked the question unless the host authorised sharing. The host's own answer
      list is never mutated.
    source:
      - "src/xubb_agents/core/engine.py: _scoped_view / _run_phase / start_content_request"
    invariant: INV-39
