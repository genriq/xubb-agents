  - id: ITC-14.FW-context-extensions-propagate
    statement: >
      Trusted host inputs on AgentContext (principal_id, insight_capabilities,
      insight_reference_context) are frozen before a run and reach every agent
      unchanged in Phase 1 and Phase 2 via the phase-context copy; an agent mutating
      its copy cannot alter the host-owned declaration on the live context.
