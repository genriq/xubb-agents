# The supported public API surface of xubb-agents.
#
# This file is HAND-MAINTAINED and is the declaration of what the project supports.
# tools/check_api_docs.py compares it against the shipped code in BOTH directions on
# every build: a new public member fails the gate until it is declared here, and a
# declared name that no longer exists fails too. That bidirectional check is what
# keeps this from becoming the kind of stale enumeration that caused the 3.1.2
# defect (see SPEC_OUTPUT_FORMAT_CONSOLIDATION SS17.1) — a list nothing compares to
# reality is a liability; a list the build compares to reality is a contract.
#
# `section` is the anchor group in docs/API_REFERENCE.md that must explain the class.
# `members` are qualified names; the facts about them are generated, never written here.

