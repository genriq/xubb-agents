# Deliberately NOT supported public API. Recorded so that 'undocumented' is a
# decision someone made, not a gap nobody noticed.
excluded:
  EffectiveTypes: >-
    return of the advisory AgentEngine.effective_insight_types helper; its fields are engi
    ne internals, and the helper's contract is documented on the method
  LLMClient: >-
    internal provider adapter; the engine owns its lifecycle and an embedder configures it
     through AgentEngine parameters, never directly
  ReferenceContext: >-
    framework-internal evidence resolution built per run; hosts supply InsightReferenceCon
    text instead
